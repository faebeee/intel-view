services:
  db:
    image: postgres:15-alpine
    container_name: intel-view-db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: intel_view
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d intel_view']
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    # minio/minio was withdrawn from public Docker Hub/Quay (pulls return
    # "denied"); the upstream server image now lives behind registry.min.io.
    # Chainguard publishes a free, maintained AGPLv3 build of the same server.
    # Pinned by digest = minio RELEASE.2026-10-23T20-06-51Z.
    image: cgr.dev/chainguard/minio@sha256:0dab2f9fee1c1139ae8753b5e35bb4461af2a276cfe0923a2504c75a6170bc64
    container_name: intel-view-minio
    restart: always
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - '9000:9000'
      - '9001:9001'
    volumes:
      - minio_data:/data
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: intel-view-api
    restart: always
    depends_on:
      db:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      PORT: 4010
      DB_HOST: db
      DB_PORT: 5432
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      DB_DATABASE: intel_view
      DATABASE_URL: postgresql://postgres:postgres@db:5432/intel_view
      MINIO_ENDPOINT: minio
      MINIO_PORT: 9000
      MINIO_USE_SSL: 'false'
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
      MINIO_BUCKET: intel-view-files
    ports:
      - '4010:4010'
    healthcheck:
      test: ['CMD', 'wget', '--spider', '-q', 'http://localhost:4010/docs-json']
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        VITE_API_URL: http://intel.local:4010 
        VITE_SDK_URL: http://api:4010 
    container_name: intel-view-web
    restart: always
    depends_on:
      api:
        condition: service_healthy
    environment:
      PORT: 4000
      VITE_API_URL: http://intel.local:4010 
    ports:
      - '4000:4000'

volumes:
  postgres_data:
  minio_data:

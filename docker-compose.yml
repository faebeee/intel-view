services:
  db:
    image: postgres:15-alpine
    container_name: intel-view-db
    restart: unless-stopped 
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: intel_view
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d intel_view']
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    # minio/minio was withdrawn from public Docker Hub/Quay (pulls return
    # "denied"); the upstream server image now lives behind registry.min.io.
    # Chainguard publishes a free, maintained AGPLv3 build of the same server.
    # Pinned by digest = minio RELEASE.2026-10-23T20-06-51Z.
    image: cgr.dev/chainguard/minio@sha256:0dab2f9fee1c1139ae8753b5e35bb4461af2a276cfe0923a2504c75a6170bc64
    container_name: intel-view-minio
    restart: unless-stopped 
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-miniouser}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-miniopass}
    ports:
      - '9000:9000'
    volumes:
      - minio_data:/data
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: intel-view-api
    restart: unless-stopped 
    depends_on:
      db:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      PORT: 4010
      DB_HOST: db
      DB_PORT: 5432
      # The browser reaches the API same-origin through `proxy` (/api), so
      # CORS only matters for direct access; allow the public proxy origin.
      APP_URL: ${PUBLIC_URL:-http://localhost:8080}
      DB_USERNAME: ${POSTGRES_USER:-postgres}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      DB_DATABASE: intel_view
      DB_SYNCHRONIZE: 'true'
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/intel_view
      MINIO_ENDPOINT: minio
      MINIO_PORT: 9000
      MINIO_USE_SSL: 'false'
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-miniouser}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-miniopass}
      MINIO_BUCKET: intel-view-files
    # No published port: reachable from the host only via `proxy`
    # (/api/*, /docs, /mcp). Other containers use http://api:4010.
    expose:
      - '4010'
    healthcheck:
      test: ['CMD', 'wget', '--spider', '-q', 'http://localhost:4010/docs-json']
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    networks:
      - default
      - kali-net

  kali:
    build:
      context: ./docker/kali
      dockerfile: Dockerfile
    container_name: intel-view-kali
    restart: always
    cap_add:
      - NET_RAW
    pids_limit: 100
    networks:
      - kali-net
    command: tail -f /dev/null

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        # Relative: the browser calls the API same-origin through `proxy`.
        VITE_API_URL: /api
    container_name: intel-view-web
    restart: always
    depends_on:
      api:
        condition: service_healthy
    environment:
      PORT: 4000
      VITE_API_URL: /api
    # No published port: reachable from the host only via `proxy`.
    expose:
      - '4000'
    healthcheck:
      test: ['CMD', 'wget', '--spider', '-q', 'http://localhost:4000/']
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  # Single entry point for the browser: serves the web app at / and the API
  # at /api (plus /docs and /mcp), so there is one origin and no CORS.
  # Configuration: docker/proxy/Caddyfile.
  proxy:
    image: docker.io/library/caddy:2.10-alpine
    container_name: intel-view-proxy
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_healthy
    ports:
      - '${PROXY_PORT:-8080}:80'
    volumes:
      - ./docker/proxy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    healthcheck:
      test: ['CMD', 'wget', '--spider', '-q', 'http://localhost:80/api/health']
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  postgres_data:
  minio_data:
  caddy_data:
  caddy_config:

networks:
  default:
  kali-net:

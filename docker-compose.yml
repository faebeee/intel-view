services:
  db:
    image: postgres:15-alpine
    container_name: intel-view-db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: intel_view
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d intel_view']
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: intel-view-api
    restart: always
    depends_on:
      db:
        condition: service_healthy
    environment:
      PORT: 4010
      HOST: http://localhost:4000
      DB_HOST: db
      DB_PORT: 5432
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      DB_DATABASE: intel_view
      DATABASE_URL: postgresql://postgres:postgres@db:5432/intel_view
    ports:
      - '4010:4010'

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NITRO_API_URL: ${NITRO_API_URL:-http://localhost:4010}
    container_name: intel-view-web
    restart: always
    depends_on:
      - api
    environment:
      PORT: 4000
      NITRO_API_URL: ${NITRO_API_URL:-http://localhost:4010}
    ports:
      - '4000:4000'

volumes:
  postgres_data:
